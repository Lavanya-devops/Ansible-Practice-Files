---
- name: Error handling example
  hosts: all
  become: true
  tasks:
    - name: Checking the versions of openssl and openssh
      ansible.builtin.apt:
        name: "{{ item }}"
        state: latest
      loop:
        - openssl
        - openssh
      ignore_errors: yes
    - name: Checking the verion of docker
      ansible.builtin.command: docker --version
      register: output
      ignore_errors: yes
    - name: Installing docker
      ansible.builtin.apt:
        name: docker.io
        state: present
      when: output.failed #means before we stored the output of docker --verion command in output variable then here you are checking failed attribute in output variable json script
        



