---
# tasks file for ec2role
- name: creating EC2 instances using loops
  amazon.aws.ec2_instance:
    name: "{{ item.name }}"
    key_name: "Devopskey"      # Name of the key pair for SSH access
    region: us-east-2                # AWS region where the instance will be created
    image_id: "{{ item.image }}" # ami-04f7a54071e74f488              # AMI ID to launch
    instance_type: t2.micro  # Instance type (e.g., t2.micro)
    security_group: devops-sg
    aws_access_key: "{{ec2_access_key}}"  # From vault as defined
    aws_secret_key: "{{ec2_secret_key}}"  # From vault as defined
    #vpc_subnet_id: subnet-0c93df7db057d1221
    network:
      assign_public_ip: true
    tags:
      environment: "{{ item.name }}"
  loop:
    - { image: "ami-0100e595e1cc1ff7f", name: "manage-node-1" } # Update AMI ID according 
    - { image: "ami-04f167a56786e4b09", name: "manage-node-2" } # to your account
    - { image: "ami-04f167a56786e4b09", name: "manage-node-3" }  
